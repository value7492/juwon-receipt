<style>

<script>
/* =====================================================================
   주원엔지니어링 법인카드 영수증 자동화 — 단일 파일 웹앱
   ===================================================================== */

/* ---------- 1. 저장소 어댑터 (환경에 따라 자동 선택) ---------- */
const Store = (() => {
  const ws = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  return {
    async get(k){
      if(ws){ try{ const r = await ws.get(k); return r ? r.value : null; }catch(e){ return null; } }
      try{ return localStorage.getItem(k); }catch(e){ return null; }
    },
    async set(k,v){
      if(ws){ try{ await ws.set(k,v); return true; }catch(e){ return false; } }
      try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
    },
    async del(k){
      if(ws){ try{ await ws.delete(k); }catch(e){} return; }
      try{ localStorage.removeItem(k); }catch(e){}
    }
  };
})();

/* 영수증 사진은 용량이 커서 IndexedDB에 따로 보관 (불가 시 일반 저장소로 대체) */
const ImgStore = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('no-idb'));
      const r = indexedDB.open('juwon_receipt', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('img'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(e => { dbp = null; throw e; });
    return dbp;
  }
  return {
    async put(k, v){
      try{
        const db = await open();
        return await new Promise((res, rej) => {
          const t = db.transaction('img','readwrite');
          t.objectStore('img').put(v, k);
          t.oncomplete = () => res(true);
          t.onerror = () => rej(t.error);
        });
      }catch(e){ return Store.set('img_' + k, v); }
    },
    async get(k){
      try{
        const db = await open();
        return await new Promise((res, rej) => {
          const t = db.transaction('img','readonly');
          const q = t.objectStore('img').get(k);
          q.onsuccess = () => res(q.result || null);
          q.onerror = () => rej(q.error);
        });
      }catch(e){ return Store.get('img_' + k); }
    },
    async del(k){
      try{
        const db = await open();
        await new Promise((res) => {
          const t = db.transaction('img','readwrite');
          t.objectStore('img').delete(k);
          t.oncomplete = res; t.onerror = res;
        });
      }catch(e){ await Store.del('img_' + k); }
    }
  };
})();

/* 기기 기억용 소형 저장 (사생활 보호 모드 등에서 실패해도 앱은 계속 동작) */
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- 2. 상태 ---------- */
const KEY = 'juwon_receipt_v1';
const DEFAULTS = {
  cards: [
    { id:'c1', last4:'1234', alias:'법인1234', dept:'', active:true }
  ],
  receipts: [],
  settings: {
    adminPin:'1234',
    geminiKey:'',
    geminiModel:'gemini-3.5-flash',
    taxEmail:'',
    myEmail:'',
    lastBackup:0,
    company:'(주)주원엔지니어링'
  }
};
let S = JSON.parse(JSON.stringify(DEFAULTS));
let session = { last4:null, admin:false, view:'home', month:ym(new Date()), week:fmtD(mondayOf(new Date())), draft:null, editId:null };

const PURPOSES = ['주유','식대','자재구입','통행료','출장경비','접대비','소모품','택배/운송','차량정비','기타'];

/* ---------- 3. 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Number(n)||0).toLocaleString('ko-KR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ym(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function ymLabel(v){ const [y,m] = v.split('-'); return y + '년 ' + Number(m) + '월'; }
function shiftMonth(v, n){
  const [y,m] = v.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return ym(d);
}
function dayOfWeek(ds){ return ['일','월','화','수','목','금','토'][new Date(ds+'T00:00:00').getDay()]; }
function cardOf(last4){ return S.cards.find(c => c.last4 === last4); }
function aliasOf(last4){ const c = cardOf(last4); return c ? c.alias : ('법인' + last4); }

function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ===== 클라우드 동기화 ===== */
let cloudState = 'connecting';   // connecting | online | offline
let cloudTimer = null;

function pack(){ return { cards:S.cards, receipts:S.receipts, settings:S.settings }; }

function applyCloud(d){
  if(!d) return false;
  S.cards = d.cards || S.cards;
  S.receipts = d.receipts || [];
  S.settings = Object.assign({}, DEFAULTS.settings, d.settings || {});
  return true;
}

/* 저장은 폰에 즉시, 클라우드에는 1.5초 모아서 한 번 */
function cloudSave(){
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => {
    await waitFB(15000);
    if(!window.FB || !window.FB.ready){ cloudState = 'offline'; render(); return; }
    try{
      await window.FB.save(pack());
      if(cloudState !== 'online'){ cloudState = 'online'; render(); }
    }catch(e){
      if(cloudState !== 'offline'){ cloudState = 'offline'; render(); }
    }
  }, 1500);
}

/* module 스크립트는 본문 파싱 후 실행되므로 준비될 때까지 기다린다 */
function waitFB(ms){
  return new Promise(res => {
    if(window.FB_LOADED) return res(true);
    let done = false;
    const fin = () => { if(!done){ done = true; res(!!window.FB_LOADED); } };
    window.addEventListener('fb-ready', fin, { once:true });
    setTimeout(fin, ms || 15000);
  });
}

async function cloudInit(){
  cloudState = 'connecting'; render();
  await waitFB(15000);
  if(!window.FB || !window.FB.ready){ cloudState = 'offline'; render(); return; }
  try{
    const remote = await window.FB.load();
    const localCount = S.receipts.length;
    const remoteCount = remote && remote.receipts ? remote.receipts.length : 0;
    if(remote && remoteCount >= localCount){
      applyCloud(remote);
      await Store.set(KEY, JSON.stringify(pack()));
    }else{
      await window.FB.save(pack());   /* 이 기기 데이터가 더 많으면 서버로 올림 */
    }
    cloudState = 'online';
    window.FB.watch(d => {
      if(!d || !d.receipts) return;
      if(JSON.stringify(d.receipts) === JSON.stringify(S.receipts)) return;
      applyCloud(d);
      Store.set(KEY, JSON.stringify(pack()));
      render();
    });
  }catch(e){
    cloudState = 'offline';
  }
  render();
}

function cloudBadge(){
  const m = { connecting:['연결 중…','rgba(255,255,255,.16)'], online:['클라우드 저장','rgba(120,220,180,.30)'], offline:['이 기기에만 저장 · 다시 연결','rgba(255,190,120,.34)'] };

/* 월별 영수증 (관리자는 전체, 일반 사용자는 본인 카드만) */
function monthReceipts(month, last4){
  return S.receipts
    .filter(r => r.date.slice(0,7) === month)
    .filter(r => last4 ? r.last4 === last4 : true)
    .sort((a,b) => a.date === b.date ? (a.last4 > b.last4 ? 1 : -1) : (a.date < b.date ? 1 : -1));
}
const sum = arr => arr.reduce((t,r) => t + (Number(r.amount)||0), 0);

/* 주간(월~일) 계산 */
function fmtD(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ const x = new Date(d); const day = (x.getDay()+6) % 7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function shiftWeek(mon, n){ const x = new Date(mon+'T00:00:00'); x.setDate(x.getDate()+n*7); return fmtD(x); }
function weekRange(mon){ const a = new Date(mon+'T00:00:00'); const b = new Date(a); b.setDate(b.getDate()+6); return [fmtD(a), fmtD(b)]; }
function weekReceipts(mon){
  const [a,b] = weekRange(mon);
  return S.receipts
    .filter(r => r.date >= a && r.date <= b)
    .filter(r => session.admin ? true : r.last4 === session.last4)
    .sort((x,y) => x.date === y.date ? (x.createdAt - y.createdAt) : (x.date < y.date ? -1 : 1));
}
function weekTSV(list){
  return list.map(r => [r.date, aliasOf(r.last4), r.vendor, Number(r.amount)||0, r.purpose||'', r.note||''].join('\t')).join('\n');
}
const mdLabel = d => Number(d.slice(5,7)) + '/' + Number(d.slice(8,10));

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  }catch(e){ return false; }
}
function showTextSheet(t){
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="inner">
    <h3>직접 복사해 주세요</h3>
    <div class="hint" style="margin-bottom:10px">아래 내용을 길게 눌러 전체 선택 후 복사하시면 됩니다.</div>
    <textarea rows="10" style="font-size:12px" readonly>${esc(t)}</textarea>
    <div class="btnrow"><button class="btn btn-ghost" id="closeT">닫기</button></div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = e => { if(e.target === el) el.remove(); };
  el.querySelector('#closeT').onclick = () => el.remove();
}

function drawPin(){
  const box = $('#pinbox'); if(!box) return;
  box.innerHTML = [0,1,2,3].map(i =>
    `<div class="pindot ${pinBuf[i] ? 'fill' : ''}">${pinBuf[i] ? '•' : ''}</div>`).join('');
}
function tryLogin(){
  const c = S.cards.find(c => c.last4 === pinBuf && c.active);
  if(!c){
    const dead = S.cards.find(c => c.last4 === pinBuf);
    $('#loginmsg').textContent = dead ? '폐기된 카드입니다. 관리자에게 문의하세요.' : '등록되지 않은 카드번호입니다.';
    pinBuf = ''; setTimeout(drawPin, 400);
    return;
  }
  if($('#rem') && $('#rem').checked){ LS.set('juwon_remember','1'); LS.set('juwon_last4', c.last4); }
  else { LS.del('juwon_remember'); LS.del('juwon_last4'); }
  session.last4 = c.last4; session.admin = false; session.view = 'home'; pinBuf = '';
  render();
}

  const pin = prompt('관리자 비밀번호를 입력하세요');

/* ---------- 7. 사진 처리 + OCR ---------- */
async function handleFile(file){
  if(!file) return;
  toast('사진을 처리하는 중…');
  try{
    const dataUrl = await compress(file, 1400, 0.62);
    startDraft(dataUrl);
    runOCR(dataUrl);
  }catch(e){
    toast('사진을 읽지 못했습니다. 다시 시도해 주세요.');
  }
}
function compress(file, maxW, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
        cx.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

async function runOCR(dataUrl){
  const key = (S.settings.geminiKey || '').trim();
  const st = $('#ocrState');
  if(!key){
    if(st) st.innerHTML = `<div class="warn"><b>자동 인식이 꺼져 있습니다.</b><br>아래 <b>사용처</b>와 <b>금액</b>을 직접 입력해야 저장됩니다. 자동으로 채우려면 설정 → OCR에서 Gemini API 키를 등록하세요.</div>`;
    return;
  }
  if(st) st.innerHTML = `<div class="warn"><span class="spin" style="border-color:rgba(122,75,11,.3);border-top-color:#7A4B0B"></span> 영수증을 읽는 중입니다…</div>`;
  const model = (S.settings.geminiModel || 'gemini-3.5-flash').trim();
  const b64 = dataUrl.split(',')[1];
  const prompt = '이 한국 영수증 또는 카드매출전표 이미지에서 정보를 추출해 JSON만 출력해라. '
    + '형식: {"date":"YYYY-MM-DD","vendor":"상호명","amount":숫자,"last4":"카드뒷4자리"}\n'
    + '- vendor: 가맹점 상호명. 영수증 맨 위의 큰 글씨 가게 이름, 또는 "가맹점명/상호/사업장" 항목의 값을 쓴다. '
    + '주소, 대표자 이름, 사업자등록번호, 전화번호, "영수증"·"카드매출전표" 같은 문서 제목은 절대 상호로 쓰지 않는다. '
    + '지점명이 함께 있으면 붙여서 쓴다(예: GS칼텍스 수원점, 이마트 정자점). 상호가 정말 안 보이면 빈 문자열.\n'
    + '- date: 거래일시의 날짜 부분만.\n'
    + '- amount: 합계/총액/승인금액 등 실제 결제된 최종 금액. 공급가액이나 부가세 금액이 아니다. 숫자만, 쉼표 없이.\n'
    + '설명이나 코드블록 없이 JSON만 출력.';
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents:[{ parts:[ { inline_data:{ mime_type:'image/jpeg', data:b64 } }, { text:prompt } ] }],
        generationConfig:{ temperature:0 }
      })
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error(res.status + ' ' + t.slice(0,180));
    }
    const j = await res.json();
    const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
    const text = parts.map(p => p.text || '').join('');
    const m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('형식 오류');
    const o = JSON.parse(m[0]);
    if(o.date && /^\d{4}-\d{2}-\d{2}$/.test(o.date)) setVal('#f_date', o.date);
    if(o.vendor) setVal('#f_vendor', String(o.vendor).slice(0,40));
    const amt = Number(String(o.amount).replace(/[^\d]/g,''));
    if(amt > 0) setVal('#f_amount', amt);
    if(st) st.innerHTML = `<div class="warn" style="background:var(--brand-soft);border-color:#BFDDD8;color:#0E4F4A">자동 인식 완료. 금액과 날짜가 맞는지 꼭 확인하세요.</div>`;
    checkDup();
  }catch(e){
    if(st) st.innerHTML = `<div class="warn">자동 인식에 실패했습니다 (${esc(e.message)}). 직접 입력해 주세요.</div>`;
  }
}
function setVal(sel, v){ const el = $(sel); if(el) el.value = v; }

async function saveDraft(){
  const last4 = $('#f_card').value;
  const date = $('#f_date').value;
  const vendor = $('#f_vendor').value.trim();
  const amount = Number($('#f_amount').value);
  const purpose = $('#f_purpose').value.trim();
  const note = $('#f_note').value.trim();
  ['#f_date','#f_vendor','#f_amount'].forEach(sel => { const e = $(sel); if(e) e.style.borderColor = ''; });
  const errBox = $('#formErr'); if(errBox) errBox.innerHTML = '';
  const fail = (sel, msg) => {
    if(errBox) errBox.innerHTML = `<div class="warn" style="background:#FBEBE9;border-color:#EBC7C2;color:#8E2C21">${msg}</div>`;
    const e = $(sel);
    if(e){ e.style.borderColor = 'var(--danger)'; e.focus(); e.scrollIntoView({ block:'center', behavior:'smooth' }); }
  };
  if(!date){ fail('#f_date','사용 일자를 입력해야 저장됩니다.'); return; }
  if(!vendor){ fail('#f_vendor','사용처(상호명)를 입력해야 저장됩니다. 영수증 위쪽 가게 이름을 적어 주세요.'); return; }
  if(!amount || amount <= 0){ fail('#f_amount','금액을 입력해야 저장됩니다. 숫자만 적어 주세요. (예: 50000)'); return; }

  const img = session.draft && session.draft.img;
  if(session.editId){
    const r = S.receipts.find(x => x.id === session.editId);
    Object.assign(r, { last4, date, vendor, amount, purpose, note, updatedAt: Date.now() });
  }else{
    const id = uid();
    S.receipts.push({ id, last4, date, vendor, amount, purpose, note, hasImg: !!img, createdAt: Date.now(), updatedAt: Date.now() });
    if(img) await ImgStore.put(id, img);
  }
  await saveAll();
  session.draft = null; session.editId = null; session.view = 'list';
  session.month = date.slice(0,7);
  render();
  toast('저장했습니다.');
}
async function removeReceipt(id){

  await ImgStore.del(id);
  await saveAll();
  session.draft = null; session.editId = null; session.view = 'list';
  render();
  toast('삭제했습니다.');
}

function loadXLSX(){
  return new Promise((res, rej) => {
    if(window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('load'));
    s.onerror = () => rej(new Error('네트워크'));
    document.head.appendChild(s);
  });
}
const HEADERS = ['사용 일자','사용 카드','사용처','금액','사용 목적','비고'];
function sheetRows(list){
  return list.slice().sort((a,b) => a.date === b.date ? (a.last4 > b.last4 ? 1 : -1) : (a.date < b.date ? -1 : 1))
    .map(r => [r.date, aliasOf(r.last4), r.vendor, Number(r.amount)||0, r.purpose||'', r.note||'']);
}
function safeSheetName(n){ return n.replace(/[\[\]\*\?\/\\:]/g,'').slice(0,31); }

async function makeExcel(){
  const list = monthReceipts(session.month, session.admin ? null : session.last4);
  if(!list.length){ toast('해당 월에 내역이 없습니다.'); return; }
  let XLSX;
  try{ XLSX = await loadXLSX(); }
  catch(e){ toast('엑셀 모듈을 불러오지 못했습니다. CSV로 받아 주세요.'); return; }

  const [y, m] = session.month.split('-');
  const wb = XLSX.utils.book_new();
  const cols = [{wch:12},{wch:12},{wch:24},{wch:13},{wch:30},{wch:18}];

  const build = (title, rows) => {
    const aoa = [[title],[],HEADERS, ...rows, [], ['','','합 계', rows.reduce((t,r) => t + r[3], 0), '', '']];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = cols;
    const total = aoa.length;
    for(let R = 3; R <= total; R++){
      const ref = XLSX.utils.encode_cell({ c:3, r:R-1 });
      if(ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '#,##0';
    }
    return ws;
  };

  const all = sheetRows(list);
  XLSX.utils.book_append_sheet(wb, build(`${y}년 ${m}월 전체 법인카드 사용내역`, all), safeSheetName(`${y}년 ${m}월 전체법인카드`));

  const cardIds = [...new Set(list.map(r => r.last4))].sort();
  cardIds.forEach(l4 => {
    const rows = sheetRows(list.filter(r => r.last4 === l4));
    const name = safeSheetName(`${aliasOf(l4)}_${y.slice(2)}${m}`);
    XLSX.utils.book_append_sheet(wb, build(`${aliasOf(l4)} ${y}년 ${m}월 사용내역`, rows), name);
  });

  XLSX.writeFile(wb, `주원엔지니어링_법인카드정산_${y}${m}.xlsx`);
  toast('엑셀 파일을 저장했습니다.');
}
function makeCSV(){
  const list = monthReceipts(session.month, session.admin ? null : session.last4);
  if(!list.length){ toast('해당 월에 내역이 없습니다.'); return; }
  const rows = sheetRows(list);
  const csv = [HEADERS, ...rows, ['','','합 계', rows.reduce((t,r)=>t+r[3],0), '', '']]
    .map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `주원엔지니어링_법인카드정산_${session.month.replace('-','')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

    <label class="f"><span class="lb">Gemini API 키</span><input type="password" id="s_key" placeholder="AQ.…" value="${esc(s.geminiKey)}"></label>
    <label class="f"><span class="lb">모델 이름</span><input type="text" id="s_model" value="${esc(s.geminiModel)}"></label>
    <div class="hint">키는 Google AI Studio에서 무료로 발급받으며 <b>AQ.</b> 로 시작합니다. 이 기기에만 저장되고 코드에는 들어가지 않습니다. 인식이 안 되면 모델 이름을 최신 버전으로 바꿔 보세요.</div>
    <div class="btnrow"><button class="btn btn-primary" id="saveSet">설정 저장</button></div>
  </div>` : ''}

  <div class="sec-title">데이터</div>
  <div class="card">
    <div class="kv"><span>등록된 영수증</span><b class="num">${S.receipts.length}건</b></div>
    <div class="kv"><span>등록된 카드</span><b class="num">${S.cards.length}장</b></div>
    <div class="kv"><span>마지막 백업</span><b>${S.settings.lastBackup ? new Date(S.settings.lastBackup).toLocaleDateString('ko-KR') : '없음'}</b></div>
    <div class="btnrow">
      <button class="btn btn-ghost" id="backupBtn">백업 파일 저장</button>
      <button class="btn btn-ghost" id="restoreBtn">백업 복원</button>
    </div>
    <input type="file" id="restoreIn" accept="application/json" style="display:none">
    ${session.admin ? `<div class="btnrow"><button class="btn btn-danger" id="wipeBtn">영수증 데이터 전체 삭제</button></div>` : ''}
    <div class="warn" style="background:var(--brand-soft);border-color:#BFDDD8;color:#0E4F4A">영수증 내역은 구글 클라우드(Firebase)에 자동 저장됩니다. 기기를 바꾸거나 캐시를 지워도 데이터가 유지되고, 여러 기기에서 같은 내역을 볼 수 있습니다.<br><b>단, 영수증 사진은 용량 때문에 이 기기에만 보관됩니다.</b> 사진까지 보존하려면 월 1회 백업을 권합니다.</div>
  </div>
  <div class="hint" style="text-align:center;margin-top:20px">${esc(s.company)} 법인카드 영수증 <b>v2.1</b></div>`;
}
function afterSettings(){
  if($('#toAdmin')) $('#toAdmin').onclick = askAdmin;
  if($('#cardsBtn')) $('#cardsBtn').onclick = () => { session.view = 'cards'; render(); };
  if($('#saveSet')) $('#saveSet').onclick = async () => {
    S.settings.company = $('#s_company').value.trim() || '(주)주원엔지니어링';
    S.settings.taxEmail = $('#s_email').value.trim();
    S.settings.myEmail = $('#s_myemail').value.trim();
    S.settings.adminPin = $('#s_pin').value.trim() || '1234';
    S.settings.geminiKey = $('#s_key').value.trim();
    S.settings.geminiModel = $('#s_model').value.trim() || 'gemini-3.5-flash';
    await saveAll(); render(); toast('설정을 저장했습니다.');
  };
  $('#backupBtn').onclick = async () => {
    S.settings.lastBackup = Date.now();
    await saveAll();
    const imgs = {};
    for(const r of S.receipts){ if(r.hasImg){ const v = await ImgStore.get(r.id); if(v) imgs[r.id] = v; } }
    const blob = new Blob([JSON.stringify({ cards:S.cards, receipts:S.receipts, settings:S.settings, imgs }, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `주원영수증_백업_${today()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  };
  if($('#wipeBtn')) $('#wipeBtn').onclick = async () => {
    if(!S.receipts.length){ toast('지울 영수증이 없습니다.'); return; }
    if(!confirm(`등록된 영수증 ${S.receipts.length}건과 사진을 모두 삭제합니다.\n카드 목록과 설정은 그대로 남습니다.\n계속할까요?`)) return;
    if(prompt('되돌릴 수 없습니다. 진행하려면 삭제 라고 입력하세요.') !== '삭제'){ toast('취소했습니다.'); return; }
    for(const r of S.receipts){ if(r.hasImg) await ImgStore.del(r.id); }
    S.receipts = [];
    await saveAll(); render(); toast('영수증 데이터를 모두 지웠습니다.');
  };
  $('#restoreBtn').onclick = () => $('#restoreIn').click();
  $('#restoreIn').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(!confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try{
        const p = JSON.parse(fr.result);
        S.cards = p.cards || []; S.receipts = p.receipts || [];
        S.settings = Object.assign({}, DEFAULTS.settings, p.settings || {});
        if(p.imgs) for(const k in p.imgs) await ImgStore.put(k, p.imgs[k]);
        await saveAll(); render(); toast('복원했습니다.');
      }catch(err){ toast('백업 파일을 읽지 못했습니다.'); }
    };
    fr.readAsText(f);
  };
}

/* ---------- 12. 카드 관리 ---------- */
function viewCards(){
  const active = S.cards.filter(c => c.active);
  const dead = S.cards.filter(c => !c.active);
  const cnt = l4 => S.receipts.filter(r => r.last4 === l4).length;
  const item = c => `<div class="row" style="flex-wrap:wrap;align-items:flex-start">
      <div class="m" style="flex:1 1 100%">
        <b>${esc(c.alias)} ${c.active ? '' : '<span class="tag off">폐기됨</span>'}</b>
        <i>${c.dept ? esc(c.dept) + ' · ' : ''}등록된 영수증 ${cnt(c.last4)}건</i>
      </div>
      <div style="display:flex;gap:8px;width:100%;margin-top:10px">
        <button class="btn btn-ghost sm" style="flex:1" data-tog="${c.id}">${c.active ? '폐기 처리' : '다시 사용'}</button>
        <button class="btn btn-danger sm" style="flex:1" data-del="${c.id}">완전 삭제</button>
      </div>
    </div>`;
  return `
  <div class="card">
    <b style="font-size:16px">법인카드 등록</b>
    <label class="f"><span class="lb">카드 뒷 4자리</span><input type="text" id="c_last4" inputmode="numeric" maxlength="4" placeholder="1234"></label>
    <label class="f"><span class="lb">주 사용 부서 / 사용자 (선택)</span><input type="text" id="c_dept" placeholder="예: 공무팀 김과장"></label>
    <div class="btnrow"><button class="btn btn-primary" id="addCard">카드 추가</button></div>
    <div class="hint">별칭은 <b>법인+뒷4자리</b> 형태로 자동 생성됩니다.<br><b>폐기 처리</b>는 카드는 목록에 남기고 새 등록만 막습니다(해지한 카드용). <b>완전 삭제</b>는 목록에서 없애며, 이미 등록된 영수증은 어느 쪽이든 그대로 유지됩니다.</div>
  </div>

  <div class="sec-title">사용 중 (${active.length}장)</div>
  ${active.length ? `<div class="rowlist">${active.map(item).join('')}</div>` : `<div class="card empty">사용 중인 카드가 없습니다.</div>`}

  ${dead.length ? `<div class="sec-title">폐기된 카드 (${dead.length}장)</div><div class="rowlist">${dead.map(item).join('')}</div>
  <div class="hint" style="margin-top:10px">폐기해도 과거 영수증 데이터는 그대로 남고 정산 보고서에도 계속 포함됩니다. 새 영수증 등록만 막힙니다.</div>` : ''}

  <div class="btnrow"><button class="btn btn-ghost" id="backSet">설정으로 돌아가기</button></div>`;
}
function afterCards(){
  $('#addCard').onclick = async () => {
    const l4 = $('#c_last4').value.replace(/[^\d]/g,'');
    if(l4.length !== 4){ toast('뒷 4자리를 숫자로 입력하세요.'); return; }
    if(S.cards.some(c => c.last4 === l4)){ toast('이미 등록된 카드번호입니다.'); return; }
    S.cards.push({ id:uid(), last4:l4, alias:'법인' + l4, dept:$('#c_dept').value.trim(), active:true });
    await saveAll(); render(); toast('카드를 추가했습니다.');
  };
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    const c = S.cards.find(x => x.id === b.dataset.tog);
    if(c.active && !confirm(`${c.alias} 카드를 폐기 처리할까요?\n과거 내역은 그대로 유지됩니다.`)) return;
    c.active = !c.active;
    await saveAll(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const c = S.cards.find(x => x.id === b.dataset.del);
    const n = S.receipts.filter(r => r.last4 === c.last4).length;
    const msg = n
      ? `${c.alias} 카드를 목록에서 완전히 삭제합니다.\n\n이 카드로 등록된 영수증 ${n}건은 지워지지 않고 내역과 정산 보고서에 그대로 남습니다.\n계속할까요?`
      : `${c.alias} 카드를 목록에서 완전히 삭제할까요?\n등록된 영수증이 없어 사라지는 기록은 없습니다.`;
    if(!confirm(msg)) return;
    S.cards = S.cards.filter(x => x.id !== b.dataset.del);
    await saveAll(); render(); toast('카드를 삭제했습니다.');
  });
  $('#backSet').onclick = () => { session.view = 'settings'; render(); };
}

/* ---------- 13. 시작 ---------- */
(async function init(){
  /* 브라우저가 저장 공간을 임의로 비우지 않도록 영구 보존 요청 */
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = await navigator.storage.persisted();
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
  await loadAll();
  const remembered = LS.get('juwon_remember') === '1' ? LS.get('juwon_last4') : null;
  if(remembered && S.cards.some(c => c.last4 === remembered && c.active)){
    session.last4 = remembered;
  }
  render();
  cloudInit();
})();
</script>
</body>
</html>
